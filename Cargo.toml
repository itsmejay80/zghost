[package]
name = "zghost"
version = "0.1.0"
edition = "2021"
description = "Warp-style inline autosuggestions for Zsh, powered by a Rust daemon"
license = "MIT"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
